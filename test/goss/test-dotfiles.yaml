file:
  ~/.claude/skills/commit/SKILL.md:
    exists: true
    filetype: file

  ~/.agents/skills/commit/SKILL.md:
    exists: true
    filetype: file

  ~/.config/git/config:
    exists: true
    filetype: file
    contents:
      - "name = mono"
      - "email = mono@mono0x.net"
      - "defaultRefFormat = reftable"

  ~/.zshenv:
    exists: true
    filetype: file
    contents:
      - export ZDOTDIR="$XDG_CONFIG_HOME/zsh"
  ~/.zshrc:
    exists: false

  # The modify_ script updates managed keys while preserving Codex's own state.
  ~/.codex/config.toml:
    exists: true
    filetype: file
    contents:
      - 'approvals_reviewer = "auto_review"'
      - "network_access = true"
      - "hooks = true"
      - "[features.network_proxy]"
      - '"api.github.com" = "allow"'
      - '"golang.flatt.tech" = "allow"'
      - '"npm.flatt.tech" = "allow"'
      - '"registry.npmjs.org" = "allow"'

command:
  test -x "$(git config --path --get gpg.ssh.program)":
    exit-status: 0

  tomlq -e '.sandbox_workspace_write.writable_roots | index(env.HOME + "/.cache/mise") != null' ~/.codex/config.toml:
    exit-status: 0

  # Non-interactive login environments such as hc core get PATH from .zprofile only.
  env -i HOME="$HOME" USER="$USER" /bin/zsh -lc 'command -v gh':
    exit-status: 0
    stdout:
      - /.local/share/chezmoi/bin/gh

  # Covers the whole Homebrew chain: Sheldon loads homebrew.zsh, which replays
  # `brew shellenv` through zsh-smartcache.
  zsh -ic 'command -v brew':
    exit-status: 0
    stdout:
      - /opt/homebrew/bin/brew

  herdr integration status:
    exit-status: 0
    stdout:
      - "claude: current"
      - "codex: current"

  jq -e '([.background, .foreground, .selection] + .ansi | all(test("^#[0-9a-fA-F]{6}$"))) and (.ansi | length == 16)' ~/.config/herdr-app/themes/one-light.json:
    exit-status: 0

  jq -e '[.hooks.PreToolUse[] | select(.matcher == "Bash") | .hooks[] | select(.command == "rtk hook claude")] | length == 1' ~/.claude/settings.json:
    exit-status: 0

  jq -e '[.hooks.PreToolUse[] | select(.matcher == "Bash") | .hooks[] | select(.command == "rtk hook codex")] | length == 1' ~/.codex/hooks.json:
    exit-status: 0

  jq -e '[.hooks.SessionStart[]?.hooks[]? | select(.command | contains("herdr-agent-state.sh"))] | length == 1' ~/.codex/hooks.json:
    exit-status: 0
