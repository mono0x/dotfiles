[bootstrap.packages]
"brew:autoconf" = "latest"
"brew:automake" = "latest"
"brew:bat" = "latest"
"brew:cmake" = "latest"
"brew:colordiff" = "latest"
"brew:coreutils" = "latest"
"brew:crit" = "latest"
"brew:curl" = "latest"
"brew:editorconfig" = "latest"
"brew:exiftool" = "latest"
"brew:fd" = "latest"
"brew:findutils" = "latest"
"brew:fswatch" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:git" = "latest"
"brew:git-delta" = "latest"
"brew:git-lfs" = "latest"
"brew:gnu-sed" = "latest"
"brew:gnu-tar" = "latest"
"brew:gnupg" = "latest"
"brew:grep" = "latest"
"brew:gzip" = "latest"
"brew:hadolint" = "latest"
"brew:hk" = "latest"
"brew:htop" = "latest"
"brew:hub" = "latest"
"brew:hyperfine" = "latest"
"brew:jq" = "latest"
"brew:moreutils" = "latest"
"brew:neovim" = "latest"
"brew:poppler" = "latest"
"brew:ripgrep" = "latest"
"brew:rsync" = "latest"
"brew:rtk" = "latest"
"brew:sheldon" = "latest"
"brew:socat" = "latest"
"brew:tig" = "latest"
"brew:unzip" = "latest"
"brew:wget" = "latest"
"brew:xz" = "latest"
"brew:yazi" = "latest"
"brew:zoxide" = "latest"
"brew:zsh" = "latest"

[bootstrap.macos.dock]
autohide = true
show_recents = false

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.user]
login_shell = "/opt/homebrew/bin/zsh"

[tools]
"github:afadesigns/zshellcheck" = "1.7.1"
"github:goss-org/goss" = "0.4.10"
actionlint = "1.7.12"
chezmoi = "2.71.1"
dprint = "0.55.2"
hk = "1.54.0"
pkl = "0.32.1"
shellcheck = "0.11.0"
shfmt = "3.13.1"
zizmor = "1.28.0"

[tasks.bootstrap]
run = [
  '''
  env -i \
    HOME="$HOME" \
    HOMEBREW_PREFIX="${HOMEBREW_PREFIX:-/opt/homebrew}" \
    GITHUB_ACTIONS="${GITHUB_ACTIONS:-}" \
  /bin/zsh --no-rcs -c '
  eval "$(/usr/libexec/path_helper -s)"
  path=(~/.local/share/mise/shims(N-/) "$HOMEBREW_PREFIX/bin"(N-/) "$HOMEBREW_PREFIX/sbin"(N-/) $path)
  chezmoi apply
  '
  ''',
]

[tasks.zsh-bench]
run = "hyperfine -w 5 -r 50 'zsh -i -c exit'"

[tasks.zsh-prof]
run = "zsh -i -c exit"
env.ZPROF = "1"

[shell_alias]
cz = "chezmoi"
