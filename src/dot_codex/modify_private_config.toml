{{- /* chezmoi:modify-template */ -}}
{{- /* Codex itself writes [projects.*], [hooks.state] and friends, so only the
       marked range is managed here. TOML requires top-level keys to precede the
       first table, hence the block goes to the top when the markers are absent. */ -}}
{{- $schema := `#:schema https://developers.openai.com/codex/config-schema.json` -}}
{{- $block := `# BEGIN dotfiles
approvals_reviewer = "auto_review"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
personality = "pragmatic"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 2

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "pull-request-number", "branch-changes", "weekly-limit"]
status_line_use_colors = true
# END dotfiles
` -}}
{{- $re := `(?s)# BEGIN dotfiles\n.*?# END dotfiles\n?` -}}
{{- $out := "" -}}
{{- if regexMatch $re .chezmoi.stdin -}}
{{-   $out = regexReplaceAllLiteral $re .chezmoi.stdin $block -}}
{{- else -}}
{{-   $out = printf "%s\n%s" $block .chezmoi.stdin -}}
{{- end -}}
{{- if not (hasPrefix $schema $out) -}}
{{-   $out = printf "%s\n%s" $schema $out -}}
{{- end -}}
{{- $out -}}
