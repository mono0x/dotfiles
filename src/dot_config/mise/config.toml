[tools]
"github:k1LoW/mo" = { version = "latest", auto_update = true }
"mr-boxington" = { version = "1.19.0", postinstall = "mbx setup --yes" }
"npm:ccstatusline" = { version = "latest", auto_update = true }
claude = { version = "latest", auto_update = true }
codex = { version = "latest", auto_update = true }
node = "24" # for npm
pnpm = "12"
uv = { version = "latest", auto_update = true }
# Pin because worktrunk@latest can fail mise's 2d minimum_release_age filter.
worktrunk = "0.80.0"

[settings]
experimental = true
disable_backends = ["asdf", "vfox"]
minimum_release_age = "2d"
minimum_release_age_excludes = [
  "claude",
  "codex",
  "node",
  "pnpm",
  "uv",
]

[settings.github]
use_git_credentials = true

[settings.pipx]
uvx = true

[settings.python]
compile = false

[shell_alias]
git = "hub"
sudo = "sudo " # trailing space lets the following word expand as an alias too
sudoe = "sudo -e"
vi = "nvim"
zed = "/Applications/Zed.app/Contents/MacOS/cli --classic" # https://github.com/zed-industries/zed/pull/59415

[env._]
path = ["~/Library/Application Support/mbx/bin"]

# Declared here so the postinstall `mbx setup --yes` finds it already configured
# and leaves this chezmoi-managed file untouched; without it setup writes the
# entry itself, which makes the next `chezmoi apply` prompt about the change
[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }
