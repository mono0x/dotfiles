file:
  ~/.config/git/config:
    exists: true
    filetype: file
    contents:
      - "name = mono"
      - "email = mono@mono0x.net"
      - "defaultRefFormat = reftable"

  ~/.zshenv:
    exists: true
    filetype: file
    contents:
      - export ZDOTDIR="$XDG_CONFIG_HOME/zsh"
  ~/.zshrc:
    exists: false

  # The modify_ script updates managed keys while preserving Codex's own state.
  ~/.codex/config.toml:
    exists: true
    filetype: file
    contents:
      - 'approvals_reviewer = "auto_review"'
      - '/writable_roots = \[.*".*[.]cache\/mise"/'
      - "network_access = true"
      - "[features.network_proxy]"
      - '"api.github.com" = "allow"'
      - '"golang.flatt.tech" = "allow"'
      - '"npm.flatt.tech" = "allow"'
      - '"registry.npmjs.org" = "allow"'

command:
  # Covers the whole Homebrew chain: Sheldon loads homebrew.zsh, which replays
  # `brew shellenv` through zsh-smartcache.
  zsh -ic 'command -v brew':
    exit-status: 0
    stdout:
      - /opt/homebrew/bin/brew

  herdr integration status:
    exit-status: 0
    stdout:
      - "claude: current"
      - "codex: current"

  jq -e '[.hooks.PreToolUse[] | select(.matcher == "Bash") | .hooks[] | select(.command == "rtk hook claude")] | length == 1' ~/.claude/settings.json:
    exit-status: 0

  jq -e '[.hooks.PreToolUse[] | select(.matcher == "Bash") | .hooks[] | select(.command == "rtk hook codex")] | length == 1' ~/.codex/hooks.json:
    exit-status: 0

  chezmoi verify ~/.codex/hooks.json:
    exit-status: 0
