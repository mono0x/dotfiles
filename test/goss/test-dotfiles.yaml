file:
  ~/.config/git/config:
    exists: true
    filetype: file
    contents:
      - "name = mono"
      - "email = mono@mono0x.net"

  ~/.zshenv:
    exists: true
    filetype: file
    contents:
      - export ZDOTDIR="$XDG_CONFIG_HOME/zsh"
  ~/.zshrc:
    exists: false
  ~/.config/zsh/.zshrc:
    exists: true
    filetype: file

  # The modify_ script manages only the marked range; entries Codex writes
  # itself, such as [projects.*], are left untouched.
  ~/.codex/config.toml:
    exists: true
    filetype: file
    contents:
      - "# BEGIN dotfiles"
      - 'model = "gpt-6-astra"'
      - "# END dotfiles"

command:
  # Covers the whole Homebrew chain: Sheldon loads homebrew.zsh, which replays
  # `brew shellenv` through zsh-smartcache.
  zsh -ic 'command -v brew':
    exit-status: 0
    stdout:
      - /opt/homebrew/bin/brew
